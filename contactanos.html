<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./Styles/contactanos.css">
</head>

<body>
    <header>
        <h1>Contáctanos</h1>
        <p>Si tienes alguna pregunta o comentario, no dudes en enviarnos un mensaje.</p>
    </header>

    <nav class="navbar navbar-expand-lg bg-dark sticky-top" data-bs-theme="dark" aria-label="Menú principal">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Música</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                aria-expanded="false" aria-label="Abrir menú de navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html">Quiénes Somos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="contactanos.html">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <section>
            <h2>Formulario de Contacto</h2>

            <form action="#" method="POST">
                <div>
                    <label for="nombre">Nombre completo:</label><br>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </div>
                <br>

                <div>
                    <label for="email">Correo electrónico:</label><br>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
                </div>
                <br>

                <div>
                    <label for="asunto">Asunto:</label><br>
                    <input type="text" id="asunto" name="asunto" placeholder="Motivo de tu mensaje" required>
                </div>
                <br>

                <div>
                    <label for="mensaje">Mensaje:</label><br>
                    <textarea id="mensaje" name="mensaje" rows="5" cols="40"
                        placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>
                <br>

                <button type="submit">Enviar mensaje</button>
            </form>
        </section>
    </main>

    <footer>
        <p><strong>Proyecto:</strong> Sitio de Blog</p>
        <p><strong>Autores:</strong> Thomas, Andrés, Tatiana y equipo</p>
        <p><strong>Contacto:</strong> correo@ejemplo.com</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
